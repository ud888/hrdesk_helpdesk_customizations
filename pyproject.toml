[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hrdesk_helpdesk_customizations"
authors = [
    { name = "HR Desk", email = "support@hrdesk.id" },
]
description = "Focused Helpdesk customizations for the HR Desk customer portal"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
helpdesk = ">=1.30.1,<2.0.0"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

